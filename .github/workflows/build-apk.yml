name: Build What's I Do APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Whats_I_Do_APK_Source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app files
        run: |
          mkdir -p www
          unzip -o Whats_I_Do_APK_Source.zip -d www
          test -f www/index.html
          test -f www/assets/icon.png

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6.2.1 @capacitor/android@6.2.1
          npm install --save-dev @capacitor/cli@6.2.1
          npx cap init "What's I Do" "com.whatsido.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply custom launcher icon
        run: |
          pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("www/assets/icon.png").convert("RGBA")

          # Pangkas area transparan di tepi, tetap menjaga artwork utuh.
          bbox = source.getbbox()
          if bbox:
              source = source.crop(bbox)

          # Ikon legacy Android dalam berbagai kepadatan.
          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")

          for density, size in densities.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              artwork = source.copy()
              artwork.thumbnail((size, size), Image.Resampling.LANCZOS)
              x = (size - artwork.width) // 2
              y = (size - artwork.height) // 2
              canvas.alpha_composite(artwork, (x, y))

              canvas.save(folder / "ic_launcher.png")
              canvas.save(folder / "ic_launcher_round.png")

          # Foreground adaptive icon: artwork berada di area aman tengah.
          adaptive_sizes = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432,
          }

          for density, size in adaptive_sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              artwork = source.copy()
              artwork.thumbnail((int(size * 0.66), int(size * 0.66)),
                                Image.Resampling.LANCZOS)
              x = (size - artwork.width) // 2
              y = (size - artwork.height) // 2
              canvas.alpha_composite(artwork, (x, y))

              canvas.save(folder / "ic_launcher_foreground.png")

          # Adaptive icon Android 8+ dengan latar transparan.
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)

          (adaptive / "ic_launcher.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''',
              encoding="utf-8"
          )

          (adaptive / "ic_launcher_round.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''',
              encoding="utf-8"
          )

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#00000000</color>
          </resources>''',
              encoding="utf-8"
          )

          print("Ikon TUGAS HARIAN sudah diterapkan ke resource Android.")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whats-I-Do-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
